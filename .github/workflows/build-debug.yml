name: Build Debug APK

# Forks don't inherit the release signing secrets, so the release workflow
# refuses to run there by design. This compiles the same code as an
# installable debug APK — CI verification and side-load testing without
# any secrets.

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'Screenshot/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'Screenshot/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    env:
      ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
      LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
      LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Stage APK
        run: |
          mkdir -p final_apk
          cp app/build/outputs/apk/debug/app-debug.apk final_apk/LastWave-debug.apk
          ls -lh final_apk/

      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LastWave-debug-APK
          path: final_apk/*
          if-no-files-found: error
