name: Build LastWave APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'Screenshot/**'
      - '**.yml'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'Screenshot/**'
      - '**.yml'
  workflow_dispatch:
    inputs:
      tv_build:
        description: 'TV build (package com.lastwave.app.tv, universal APK)'
        type: boolean
        default: false

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    env:
      TV_BUILD: ${{ inputs.tv_build }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
      RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
      LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
      LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Unseal release signing key (DollBloom lock file)
        # Runs only when no signing secrets are configured on the repo. The
        # encrypted keystore lives in the DollBloom repo and the passphrase is
        # fetched from DollBloom's workflow at build time — nothing secret is
        # stored in this repository. Set SIGNING_KEY etc. as repo secrets to
        # bypass this step entirely.
        if: env.SIGNING_KEY == '' && env.RELEASE_STORE_FILE == '' && env.RELEASE_STORE_PASSWORD == ''
        run: |
          set -euo pipefail
          DOLLBLOOM_RAW="https://raw.githubusercontent.com/DominatorStufs/DollBloom/master"
          mkdir -p signing
          curl -fsSL --retry 3 "$DOLLBLOOM_RAW/signing/dollbloom_signing.py" -o signing/dollbloom_signing.py
          curl -fsSL --retry 3 "$DOLLBLOOM_RAW/signing/keycheck.json" -o signing/keycheck.json
          curl -fsSL --retry 3 "$DOLLBLOOM_RAW/signing/dollbloom-release.keystore.enc" -o signing/dollbloom-release.keystore.enc
          # Passphrase stays at home in the DollBloom repo (android.yml builtin).
          PASSPHRASE=$(curl -fsSL --retry 3 "$DOLLBLOOM_RAW/.github/workflows/android.yml" \
            | grep -o "vars.DOLLBLOOM_SIGNING_PASSPHRASE || '[^']*'" \
            | sed "s/^.*|| '//; s/'$//") || true
          if [ -z "${PASSPHRASE:-}" ]; then
            echo "::warning::Could not fetch the DollBloom passphrase — skipping key unseal. Set SIGNING_KEY secret for signed builds."
            exit 0
          fi
          export DOLLBLOOM_SIGNING_PASSPHRASE="$PASSPHRASE"
          python3 signing/dollbloom_signing.py --repo-root . --passphrase-env DOLLBLOOM_SIGNING_PASSPHRASE \
            unseal --out-dir signing-unsealed
          JKS="$PWD/signing-unsealed/dollbloom-release.jks"
          test -f "$JKS" || { echo "::error::Unseal did not produce the JKS"; exit 1; }
          # Written to local.properties (read by resolveSecret when env vars are
          # blank) — step-level env of the build step would override GITHUB_ENV.
          {
            echo "RELEASE_STORE_FILE=$JKS"
            echo "RELEASE_STORE_PASSWORD=$PASSPHRASE"
            echo "RELEASE_KEY_ALIAS=dollbloom"
            echo "RELEASE_KEY_PASSWORD=$PASSPHRASE"
          } >> local.properties
          rm -f signing/dollbloom_signing.py signing/keycheck.json signing/dollbloom-release.keystore.enc
          echo "::notice::Release key unsealed from DollBloom lock file (alias dollbloom)."

      - name: Build Release APK
        env:
          ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
          LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
          LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease ${{ inputs.tv_build == true && '-PtvApp=true' || '' }} --stacktrace

      - name: Stage Final APK
        id: prep_apk
        run: |
          mkdir -p final_apk
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="5.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          if [ "$TV_BUILD" = "true" ]; then
            echo "Building TV APK (com.lastwave.app.tv) for LastWave v$VERSION"
            APK_PREFIX="LastWave-TV"
          else
            echo "Building APK for LastWave v$VERSION"
            APK_PREFIX="LastWave"
          fi
          echo "apk_prefix=$APK_PREFIX" >> $GITHUB_OUTPUT
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            cp app/build/outputs/apk/release/app-release-signed.apk final_apk/${APK_PREFIX}-v${VERSION}-release.apk
          else
            cp app/build/outputs/apk/release/app-release.apk final_apk/${APK_PREFIX}-v${VERSION}-release.apk
          fi
          ls -lh final_apk/

      - name: Verify APK signature + publish checksum
        run: |
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDKROOT/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | head -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found under $SDKROOT, skipping signature verification"
          else
            for apk in final_apk/*.apk; do
              echo "Verifying $apk ..."
              "$APKSIGNER" verify --print-certs "$apk" > /dev/null || { echo "::error::APK failed signature verification: $apk"; exit 1; }
            done
            echo "All APK signatures valid."
          fi
          (cd final_apk && sha256sum *.apk > SHA256SUMS.txt)
          cat final_apk/SHA256SUMS.txt

      - name: Upload Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.prep_apk.outputs.apk_prefix }}-v${{ steps.prep_apk.outputs.version }}-APK
          path: final_apk/*
          if-no-files-found: error
