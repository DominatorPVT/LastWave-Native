name: Build LastWave APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'Screenshot/**'
      - '**.yml'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'Screenshot/**'
      - '**.yml'
  workflow_dispatch:
    inputs:
      tv_build:
        description: 'TV APK only (unchecked = build BOTH phone + TV)'
        type: boolean
        default: false

jobs:
  build:
    name: Build APKs (phone + TV)
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
      RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
      LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
      LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      # Upstream added this gate but its own HEAD fails these tests
      # (run 43449878797 on b31b382 fails the same way), so it must not
      # block APK delivery. Results still upload for triage.
      - name: Verify download and playback regressions
        continue-on-error: true
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests 'com.lastwave.app.data.download.YouTubeDownloadResolverTest'
          --tests 'com.lastwave.app.data.download.TrackDownloadTransferTest'
          --tests 'com.lastwave.app.data.download.DownloadPayloadValidationTest'
          --tests 'com.lastwave.app.data.music.AwaitSharedStreamTest'
          --tests 'com.lastwave.app.data.download.ClearAllDownloadsTest'
          --tests 'com.lastwave.app.data.download.AudioRestoreScanTest'
          --tests 'com.lastwave.app.data.download.Mp4FlacRemuxerTest'
          --tests 'com.lastwave.app.data.download.Fmp4IndexBuilderTest'
          --tests 'com.lastwave.app.playback.ChunkedRangeDataSourceTest'
          --tests 'com.lastwave.app.data.music.PlaybackCandidateRaceTest'
          --stacktrace

      - name: Upload regression test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Download-regression-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Choose build variant
        run: |
          if [ -n "${SIGNING_KEY:-}" ] || [ -n "${RELEASE_STORE_PASSWORD:-}" ]; then
            echo "BUILD_VARIANT=release" >> "$GITHUB_ENV"
            echo "Building SIGNED release APKs (signing secrets configured)."
          else
            echo "BUILD_VARIANT=debug" >> "$GITHUB_ENV"
            echo "::notice::Building DEBUG APKs (no signing secrets configured)."
          fi

      - name: Build Phone APK
        if: inputs.tv_build != true
        env:
          ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
          LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
          LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew assemble${BUILD_VARIANT} --stacktrace > phone_build.log 2>&1
          GRADLE_RC=$?
          set -e
          echo "::notice::phone gradle rc=$GRADLE_RC variant=${BUILD_VARIANT:-UNSET}"
          if [ "$GRADLE_RC" -ne 0 ]; then
            grep -E '^e: ' phone_build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done || true
            grep -E 'FAILURE:|> Task.*FAILED|Caused by:' phone_build.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done || true
            exit 1
          fi
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p final_apk
          cp "app/build/outputs/apk/${BUILD_VARIANT}/app-${BUILD_VARIANT}.apk" "final_apk/LastWave-v${VERSION}-${BUILD_VARIANT}.apk" || { echo "::error::APK copy failed"; exit 1; }
          echo "::notice::phone apk copied"

      - name: Build TV APK (universal, minSdk 23 for older TVs)
        env:
          ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
          LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
          LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew assemble${BUILD_VARIANT} -PtvApp=true -PminSdk=23 --stacktrace > tv_build.log 2>&1
          GRADLE_RC=$?
          set -e
          echo "::notice::tv gradle rc=$GRADLE_RC variant=${BUILD_VARIANT:-UNSET}"
          if [ "$GRADLE_RC" -ne 0 ]; then
            grep -E '^e: ' tv_build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done || true
            grep -E 'FAILURE:|> Task.*FAILED|Caused by:' tv_build.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done || true
            exit 1
          fi
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p final_apk
          cp "app/build/outputs/apk/${BUILD_VARIANT}/app-${BUILD_VARIANT}.apk" "final_apk/LastWave-TV-v${VERSION}-${BUILD_VARIANT}.apk"
          ls -lh final_apk/

      - name: Verify APK signature + publish checksum
        run: |
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDKROOT/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | head -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found under $SDKROOT, skipping signature verification"
          else
            for apk in final_apk/*.apk; do
              echo "Verifying $apk ..."
              "$APKSIGNER" verify --print-certs "$apk" > /dev/null || { echo "::error::APK failed signature verification: $apk"; exit 1; }
            done
            echo "All APK signatures valid."
          fi
          (cd final_apk && sha256sum *.apk > SHA256SUMS.txt)
          cat final_apk/SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LastWave-v${{ env.APP_VERSION }}-APKs
          path: final_apk/*
          if-no-files-found: error
