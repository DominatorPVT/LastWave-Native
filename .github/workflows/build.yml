name: Build LastWave APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'Screenshot/**'
      - '**.yml'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'Screenshot/**'
      - '**.yml'
  workflow_dispatch:
    inputs:
      tv_build:
        description: 'TV APK only (unchecked = build BOTH phone + TV)'
        type: boolean
        default: false

jobs:
  build:
    name: Build APKs (phone + TV)
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
      RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
      LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
      LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Verify download and playback regressions
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests 'com.lastwave.app.data.download.YouTubeDownloadResolverTest'
          --tests 'com.lastwave.app.data.download.TrackDownloadTransferTest'
          --tests 'com.lastwave.app.data.download.DownloadPayloadValidationTest'
          --tests 'com.lastwave.app.data.music.AwaitSharedStreamTest'
          --tests 'com.lastwave.app.data.download.ClearAllDownloadsTest'
          --tests 'com.lastwave.app.data.download.AudioRestoreScanTest'
          --tests 'com.lastwave.app.data.download.Mp4FlacRemuxerTest'
          --tests 'com.lastwave.app.data.download.Fmp4IndexBuilderTest'
          --tests 'com.lastwave.app.playback.ChunkedRangeDataSourceTest'
          --tests 'com.lastwave.app.data.music.PlaybackCandidateRaceTest'
          --stacktrace

      - name: Upload regression test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Download-regression-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Unseal release signing key (DollBloom lock file)
        # Runs only when no signing secrets are configured on the repo. The
        # encrypted keystore lives in the DollBloom repo; the passphrase is
        # fetched from DollBloom's own workflow at build time — nothing
        # secret is stored in this repository. The decrypted PKCS#12 is used
        # directly (AGP reads PKCS#12 stores fine on JDK 9+), so no keytool
        # conversion is involved. Any failure here degrades gracefully to
        # debug APKs instead of failing the run.
        if: env.SIGNING_KEY == '' && env.RELEASE_STORE_PASSWORD == ''
        run: |
          set -euo pipefail
          (
            DOLLBLOOM_RAW="https://raw.githubusercontent.com/DominatorStufs/DollBloom/master"
            mkdir -p signing
            for f in dollbloom_signing.py keycheck.json dollbloom-release.keystore.enc; do
              curl -fsSL --retry 3 "$DOLLBLOOM_RAW/signing/$f" -o "signing/$f"
            done
            # Passphrase lives in DollBloom's own workflow (android.yml builtin).
            PASSPHRASE=$(curl -fsSL --retry 3 "$DOLLBLOOM_RAW/.github/workflows/android.yml" \
              | grep -o "vars.DOLLBLOOM_SIGNING_PASSPHRASE || '[^']*'" \
              | sed "s/^.*|| '//; s/'$//") || true
            if [ -z "${PASSPHRASE:-}" ]; then
              echo "::warning::Could not fetch the DollBloom passphrase."
              exit 3
            fi
            export DOLLBLOOM_SIGNING_PASSPHRASE="$PASSPHRASE"
            python3 - << 'PYEOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, "signing")
          import dollbloom_signing as ds
          root = Path(".")
          check = ds.load_check(root)
          args = type("Args", (), {"passphrase_env": "DOLLBLOOM_SIGNING_PASSPHRASE"})()
          passphrase = ds.resolve_passphrase(args)
          ds.check_passphrase(passphrase, check)
          out = Path("signing-unsealed"); out.mkdir(exist_ok=True)
          p12 = out / "dollbloom-release.p12"
          p12.write_bytes(ds.decrypt_bytes(ds.read_blob(root), passphrase))
          (out / "keystore.properties").write_text(
              "\n".join([
                  "storeFile=" + str(p12.resolve()),
                  "storeType=PKCS12",
                  "storePassword=" + passphrase,
                  "keyAlias=" + check["key_alias"],
                  "keyPassword=" + passphrase,
                  "",
              ]),
              encoding="utf-8",
          )
          print("Unsealed signing key -> PKCS12 (no keytool involved)")
          PYEOF
            test -f signing-unsealed/dollbloom-release.p12 || { echo "::error::Unseal produced no keystore"; exit 3; }
            # Validate the store with the JDK we already have; broken store ->
            # debug fallback instead of a half-signed build.
            keytool -list -keystore signing-unsealed/dollbloom-release.p12 \
              -storepass "$PASSPHRASE" > /dev/null 2>&1 || {
              echo "::warning::Unsealed store failed keytool validation."
              exit 3
            }
            ALIAS=$(grep '^keyAlias=' signing-unsealed/keystore.properties | cut -d= -f2)
            {
              echo "RELEASE_STORE_FILE=$PWD/signing-unsealed/dollbloom-release.p12"
              echo "RELEASE_STORE_PASSWORD=$PASSPHRASE"
              echo "RELEASE_KEY_ALIAS=$ALIAS"
              echo "RELEASE_KEY_PASSWORD=$PASSPHRASE"
            } >> local.properties
            # Also expose as env so build steps can pass them as -P Gradle
            # properties (the most direct channel — findProperty resolution).
            {
              echo "UNSEALED_STORE_FILE=$PWD/signing-unsealed/dollbloom-release.p12"
              echo "UNSEALED_STORE_PASSWORD=$PASSPHRASE"
              echo "UNSEALED_KEY_ALIAS=$ALIAS"
              echo "UNSEALED_KEY_PASSWORD=$PASSPHRASE"
              echo "UNSEALED_STORE_TYPE=PKCS12"
            } >> "$GITHUB_ENV"
            echo "::notice::Release key unsealed from the DollBloom lock file (alias $ALIAS) — signed builds enabled."
          ) || echo "::warning::Signing key unavailable — falling back to DEBUG APKs (still fully installable)."

      - name: Choose build variant
        run: |
          if grep -q "^RELEASE_STORE_FILE=" local.properties 2>/dev/null; then
            echo "BUILD_VARIANT=release" >> "$GITHUB_ENV"
            echo "Building SIGNED release APKs."
          else
            echo "BUILD_VARIANT=debug" >> "$GITHUB_ENV"
            echo "::notice::Building DEBUG APKs (signing key unavailable)."
          fi

      - name: Build Phone APK
        if: inputs.tv_build != true
        env:
          ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
          LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
          LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          SIGNING_ARGS=""
          if [ -n "${UNSEALED_STORE_FILE:-}" ]; then
            SIGNING_ARGS="-PRELEASE_STORE_FILE=$UNSEALED_STORE_FILE -PRELEASE_STORE_PASSWORD=$UNSEALED_STORE_PASSWORD -PRELEASE_KEY_ALIAS=$UNSEALED_KEY_ALIAS -PRELEASE_KEY_PASSWORD=$UNSEALED_KEY_PASSWORD -PRELEASE_STORE_TYPE=$UNSEALED_STORE_TYPE"
            echo "Passing unsealed DollBloom signing key to Gradle."
          fi
          ./gradlew assemble${BUILD_VARIANT} $SIGNING_ARGS --stacktrace
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p final_apk
          cp "app/build/outputs/apk/${BUILD_VARIANT}/app-${BUILD_VARIANT}.apk" "final_apk/LastWave-v${VERSION}-${BUILD_VARIANT}.apk"

      - name: Build TV APK (universal, minSdk 23 for older TVs)
        env:
          ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
          LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
          LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          SIGNING_ARGS=""
          if [ -n "${UNSEALED_STORE_FILE:-}" ]; then
            SIGNING_ARGS="-PRELEASE_STORE_FILE=$UNSEALED_STORE_FILE -PRELEASE_STORE_PASSWORD=$UNSEALED_STORE_PASSWORD -PRELEASE_KEY_ALIAS=$UNSEALED_KEY_ALIAS -PRELEASE_KEY_PASSWORD=$UNSEALED_KEY_PASSWORD -PRELEASE_STORE_TYPE=$UNSEALED_STORE_TYPE"
          fi
          ./gradlew assemble${BUILD_VARIANT} -PtvApp=true -PminSdk=23 $SIGNING_ARGS --stacktrace
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p final_apk
          cp "app/build/outputs/apk/${BUILD_VARIANT}/app-${BUILD_VARIANT}.apk" "final_apk/LastWave-TV-v${VERSION}-${BUILD_VARIANT}.apk"
          ls -lh final_apk/

      - name: Verify APK signature + publish checksum
        run: |
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDKROOT/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | head -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found under $SDKROOT, skipping signature verification"
          else
            for apk in final_apk/*.apk; do
              echo "Verifying $apk ..."
              "$APKSIGNER" verify --print-certs "$apk" > /dev/null || { echo "::error::APK failed signature verification: $apk"; exit 1; }
            done
            echo "All APK signatures valid."
          fi
          (cd final_apk && sha256sum *.apk > SHA256SUMS.txt)
          cat final_apk/SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LastWave-v${{ env.APP_VERSION }}-APKs
          path: final_apk/*
          if-no-files-found: error

      - name: Remove unsealed key material
        if: always()
        run: rm -rf signing signing-unsealed
